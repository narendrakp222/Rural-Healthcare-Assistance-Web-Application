{% extends "base.html" %}
{% block content %}
<section class="container py-4">
  <div class="page-head"><h1>Feedback</h1><span>Community responses</span></div>
  <div class="row g-3">{% for item in feedback_items %}<div class="col-md-6"><div class="panel"><h2>{{ item.name }}</h2><p>{{ item.message }}</p><small>{{ item.created_at.strftime("%d %b %Y") }}</small></div></div>{% else %}<p class="text-muted">No feedback.</p>{% endfor %}</div>
</section>
{% endblock %}
